<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
</head>
<body>
    <form id="form-inscription">
        <div>
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required>
            <small class="error-msg" id="err-nom" style="color: red;"></small>
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <small class="error-msg" id="err-email" style="color: red;"></small>
        </div>

        <div>
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>
            <small class="error-msg" id="err-password" style="color: red;"></small>
        </div>

        <div>
            <label for="code_postal">Code Postal</label>
            <input type="text" id="code_postal" name="code_postal" required>
            <small class="error-msg" id="err-cp" style="color: red;"></small>
        </div>

        <button type="submit">S'inscrire</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
